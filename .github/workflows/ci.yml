name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly run at 06:00 UTC to catch upstream regressions (ROS/Clearpath apt sources, etc.).
  schedule:
    - cron: '0 6 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  installer-e2e:
    name: Installer end-to-end (${{ matrix.codename }})
    # Boots systemd in a privileged container and pulls the full ROS 2 +
    # Clearpath package set. Runs on every push and pull request.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codename: [noble, jammy]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run installer in systemd container
        run: |
          chmod +x test/run_installer_test.sh
          test/run_installer_test.sh "${{ matrix.codename }}"

  nightly-failure-issue:
    name: Open issue on scheduled failure
    needs: [pre-commit, installer-e2e]
    if: ${{ github.event_name == 'schedule' && failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly CI failure on $(date -u +%Y-%m-%d)"
          label="nightly-ci-failure"

          # Ensure the label exists (ignore error if it already does).
          gh label create "$label" \
            --repo "$REPO" \
            --color "b60205" \
            --description "Automatically opened by the nightly CI workflow" \
            2>/dev/null || true

          body=$(cat <<EOF
          The nightly scheduled CI run failed.

          - Workflow run: $RUN_URL
          - Commit: ${{ github.sha }}
          - Triggered at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          One or more jobs reported \`failure\`. Please investigate.
          EOF
          )

          # Reuse an already-open nightly-failure issue if one exists, otherwise open a new one.
          existing=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label "$label" \
            --json number \
            --jq '.[0].number')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create \
              --repo "$REPO" \
              --title "$title" \
              --label "$label" \
              --body "$body"
          fi
